<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Facebook - log in or sign up</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="./icons/favicon.png" type="image/x-icon">
</head>
<body>
<main class="content container">
  <section class="info">
    <div class="info-logo">
      <img src="./icons/facebook_logo.svg" alt="facebook" class="info-logo-image" width="320" height="105" loading="lazy">
      <h1 class="info-logo-title">Connect with friends and the world around you on Facebook.</h1>
    </div>
<!--        <h1 class="info-title">Connect with friends and the world around you on Facebook.</h1>-->
  </section>
    <section class="login">
        <form action="" class="login-form">
            <label for="email-or-phone" class="visually-hidden"></label>
            <input type="text" class="login-form-input input" id="email-or-phone" placeholder="Email or phone number">
            <label for="password" class="visually-hidden"></label>
            <input type="password" class="login-form-input input" id="password" placeholder="Password">
            <button class="login-form-button" type="submit">Log In</button>
            <div class="login-form-forgot-password">
                <a href="/">Forgot password?</a>
            </div>
            <div class="login-form-line"></div>
            <a class="login-form-new-account-button" href="/">Create new account</a>
        </form>
        <div class="login-create-page-button">
            <a class="login-create-page-button-link"href="/">Create a Page </a> for a celebrity, brand or business.
        </div>
    </section>
</main>
</body>
</html>
